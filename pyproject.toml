[build-system]
build-backend = 'hatchling.build'
requires = [
    'hatch-vcs~=0.5.0',
    "hatchling~=1.32.0",
    "setuptools-scm~=10.2.1",
]

[project]
name = 'moretools'
description = 'MORE Overly Reusable Essentials for python'
dynamic = ['version']

authors = [{ name = 'Stefan Zimmermann', email = 'user@zimmermann.co' }]
urls = { Repository = 'https://github.com/zimmermanncode/moretools'}
license = 'LGPL-3.0-or-later'
license-files = ['COPYING', 'COPYING.LESSER']

requires-python = '>=3.14.7'
dependencies = [
    'decorator~=5.3.1',
    "six~=1.17.0",
]

[dependency-groups]
dev = [
    'ipython~=9.18.1',
    'mypy~=2.3.1',
    'pre-commit~=4.6.2',
    'pytest~=9.1.1',
    'pytest-cov~=7.1.0',
    'ruff~=0.16.3',
    'setuptools-scm~=10.2.1',
]

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = 'moretools/__version__.py'

[tool.setuptools_scm]
version_file = 'moretools/__version__.py'
